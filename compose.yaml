services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mocktest
      POSTGRES_USER: mocktest
      POSTGRES_PASSWORD: mocktest
    ports:
      - "5432:5432"
    volumes:
      - mocktest_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mocktest -d mocktest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mocktest_postgres_data:
